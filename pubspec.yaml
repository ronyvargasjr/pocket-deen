name: pocket_deen
version: 1.0.0+1
description: A daily Islamic resources app for Muslims.
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0
  shared_preferences: ^2.0.15
  intl: 0.20.2
  geolocator: ^10.0.0
  permission_handler: ^11.0.0
  sensors_plus: ^3.0.0
  clipboard: ^0.1.3
  flutter_svg: ^2.0.0
  cupertino_icons: ^1.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/data/